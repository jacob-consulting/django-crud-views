name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: 'pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt'
      - run: nox -s "tests-${{ matrix.python-version }}(django='4.2')" "tests-${{ matrix.python-version }}(django='5.2')" "tests-${{ matrix.python-version }}(django='6.0')"
      # Every row uploads one report per Django session; Codecov merges them per commit.
      # codecov.yml (after_n_builds) waits for all rows before posting statuses. See #105.
      - id: coverage-files
        run: echo "files=$(ls coverage-py*.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-files.outputs.files }}
          disable_search: true
          flags: py${{ matrix.python-version }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: 'pip install --require-hashes --only-binary :all: -r docs/requirements.txt'
      - run: mkdocs build --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: 'pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt'
      - run: ruff format --check .
      - run: ruff check .

  publish:
    needs: [tests, docs, lint]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: 'pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt'
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
