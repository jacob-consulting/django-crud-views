name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install nox uv
      - run: nox -s "tests-${{ matrix.python-version }}(django='4.2')" "tests-${{ matrix.python-version }}(django='5.2')" "tests-${{ matrix.python-version }}(django='6.0')"
      - run: nox -s "examples-${{ matrix.python-version }}(django='4.2')" "examples-${{ matrix.python-version }}(django='5.2')" "examples-${{ matrix.python-version }}(django='6.0')"
      # Every row uploads one report per Django session; Codecov merges them per commit.
      # codecov.yml (after_n_builds) waits for all rows before posting statuses. See #105.
      - id: coverage-files
        run: echo "files=$(ls coverage-py*.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-files.outputs.files }}
          disable_search: true
          flags: py${{ matrix.python-version }}
