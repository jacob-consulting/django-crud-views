# SonarQube Cloud automatic analysis (GitHub app). Only the keys listed at
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/ are read here;
# issue suppressions (sonar.issue.ignore.*) must be set in the SonarQube Cloud UI instead.

# Migrations are generated by Django; tests/browser is the disposable browser acceptance harness.
sonar.exclusions=**/migrations/**,tests/browser/**

sonar.python.version=3.12,3.13,3.14
sonar.sourceEncoding=UTF-8
