# SonarQube analysis of the package sources. Run with `task sonar` (see CONTRIBUTING.md).
sonar.projectKey=django-crud-views:main
sonar.projectName=django-crud-views
sonar.host.url=https://sonar.cnbg-n.com

sonar.sources=src
sonar.tests=tests
# Generated by Django.
sonar.exclusions=**/migrations/**
# Vitest writes no coverage report yet; JS is analysed but not counted for coverage.
sonar.coverage.exclusions=**/*.js

sonar.python.version=3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# False positives: the object-detail layout partials render a single <li> / <dt>+<dd>
# per property; the <ul> / <dl> container lives in the layout's group.html, which
# includes them. Sonar analyses each template file in isolation.
sonar.issue.ignore.multicriteria=od_partials
sonar.issue.ignore.multicriteria.od_partials.ruleKey=Web:ItemTagNotWithinContainerTagCheck
sonar.issue.ignore.multicriteria.od_partials.resourceKey=src/crud_views_object_detail/templates/crud_views_object_detail/layouts/*/property.html
