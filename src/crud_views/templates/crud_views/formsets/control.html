{% load crud_views %}
{% load i18n %}
<div class="cv-form-ctrl">

    <fieldset class="{% cv_button_class 'formset' 'container' %}" aria-label="{% translate 'Row controls' %}">
        {% if formset.can_order %}
            <fieldset class="{% cv_button_class 'formset' 'container' %}" aria-label="{% translate 'Order' %}">
                <button type="button" class="{% cv_button_class 'formset' 'control' %} cv-form-ctrl-up" title="up" aria-label="{% translate 'Move up' %}"
                        cv-data-formset-form-prefix="{{ form.prefix }}">
                    {% cv_icon "formset-up" %}
                </button>
                <button type="button" class="{% cv_button_class 'formset' 'control' %} cv-form-ctrl-down" title="down" aria-label="{% translate 'Move down' %}"
                        cv-data-formset-form-prefix="{{ form.prefix }}">
                    {% cv_icon "formset-down" %}
                </button>
            </fieldset>
        {% endif %}
        <fieldset class="{% cv_button_class 'formset' 'container' %}" aria-label="{% translate 'Add or delete' %}">
            <button type="button" class="{% cv_button_class 'formset' 'control' %} cv-form-ctrl-add" title="add" aria-label="{% translate 'Add row' %}"
                    cv-data-formset-form-prefix="{{ form.prefix }}">
                {% cv_icon "formset-add" %}
            </button>
            {% if formset.can_delete %}
                <button type="button" class="{% cv_button_class 'formset' 'control' %} cv-form-ctrl-delete" data-cv-class="{% cv_button_class 'formset' 'control' %}"
                        data-cv-class-danger="{% cv_button_class 'formset' 'control-danger' %}" title="delete" aria-label="{% translate 'Delete row' %}"
                        cv-data-formset-form-prefix="{{ form.prefix }}">
                    {% cv_icon "formset-delete" %}
                </button>
            {% endif %}
        </fieldset>
    </fieldset>

</div>
