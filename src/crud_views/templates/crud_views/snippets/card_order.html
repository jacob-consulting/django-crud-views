{% load crud_views %}
{% load i18n %}
{% if view.cv_order_fields %}
<form method="get" id="cv-card-order-form" class="d-flex align-items-center gap-2 mb-3">
    <label class="mb-0 me-1" for="cv-order-select">{% translate "Order by" %}</label>
    <select name="{{ cv_order_param }}" id="cv-order-select" class="form-select form-select-sm w-auto"{% if cv_order_signed %} data-cv-action="submit-on-change"{% endif %}>
        {% for choice in cv_order_choices %}
            <option value="{{ choice.name }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>
        {% endfor %}
    </select>
    {% if not cv_order_signed %}
    <fieldset class="{% cv_button_class 'card-order' 'container' %}" aria-label="{% translate 'Sort direction' %}">
        <button type="submit" name="{{ cv_order_dir_param }}" value="asc"
                class="{% cv_button_class 'card-order' 'toggle' %}{% if cv_order_dir == 'asc' %} active{% endif %}"
                title="{% translate 'Ascending' %}">
            {% cv_icon "sort-asc" %}
        </button>
        <button type="submit" name="{{ cv_order_dir_param }}" value="desc"
                class="{% cv_button_class 'card-order' 'toggle' %}{% if cv_order_dir == 'desc' %} active{% endif %}"
                title="{% translate 'Descending' %}">
            {% cv_icon "sort-desc" %}
        </button>
    </fieldset>
    {% endif %}
    {% for param in cv_order_preserved_params %}
        <input type="hidden" name="{{ param.name }}" value="{{ param.value }}">
    {% endfor %}
</form>
{% endif %}
