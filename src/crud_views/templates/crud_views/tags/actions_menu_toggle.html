{% load crud_views %}
{% load i18n %}
<button type="button" class="{% cv_button_class cv_location "menu-toggle" %} dropdown-toggle cv-menu-toggle{% if cv_menu_icon_class %} {{ cv_menu_icon_class }}{% endif %}"
        data-bs-toggle="dropdown" aria-expanded="false" aria-label="{% translate 'More actions' %}"
        {% if cv_location == "list" %}data-bs-popper-config='{"strategy":"fixed"}'{% endif %}>
    {% if cv_menu_icon_inline %}{% cv_icon cv_menu_icon %}{% endif %}<span class="{% cv_button_class cv_location 'hidden-label' %}">{% translate "More actions" %}</span>
</button>
