{% load crud_views i18n %}{% cv_button_class "alert" "dismissible" as dismissible_class %}
<div class="{% cv_button_class "alert" alert.level %}{% if alert.dismissible and dismissible_class %} {{ dismissible_class }}{% endif %}{% if alert.extra_tags %} {{ alert.extra_tags }}{% endif %}"
     role="alert">
    {% cv_icon alert.icon_name "me-2" %}{% if alert.heading %}<strong>{{ alert.heading }}</strong>{% if alert.text %} {% endif %}{% endif %}{% include alert.body_template %}
    {% if alert.dismissible %}<button type="button" class="{% cv_button_class 'alert' 'close' %}" data-cv-alert-dismiss aria-label="{% translate 'Close' %}"></button>{% endif %}
</div>
