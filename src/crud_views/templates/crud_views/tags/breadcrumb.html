{% if items %}{% load crud_views %}
    <nav aria-label="breadcrumb">
        <ol class="{% cv_button_class "breadcrumb" "list" %}">
            {% for item in items %}
                {% if forloop.last %}
                    <li class="{% cv_button_class "breadcrumb" "item" %} {% cv_button_class "breadcrumb" "item-active" %}" aria-current="page">{{ item.title }}</li>
                {% else %}
                    <li class="{% cv_button_class "breadcrumb" "item" %}">
                        {% if item.url %}<a href="{{ item.url }}">{{ item.title }}</a>{% else %}{{ item.title }}{% endif %}
                    </li>
                {% endif %}
            {% endfor %}
        </ol>
    </nav>
{% endif %}
