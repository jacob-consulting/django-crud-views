{% load crud_views %}
{% cv_card_action_group object as group %}

<div class="card mb-3">
    <div class="card-body">
        <h5 class="card-title">{{ object }}</h5>
        {% for ctx in group.menu %}
            {% cv_render_list_action_form ctx %}
        {% endfor %}
        {% include "crud_views/tags/button/container.html" with cv_buttons=group.inline cv_group=group cv_location="card" cv_container_tag="div" %}
    </div>
</div>
