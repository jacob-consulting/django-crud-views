{% if cv_navbar %}{% load crud_views i18n %}<nav aria-label="{% blocktranslate with object=cv_navbar.label %}Sections for {{ object }}{% endblocktranslate %}">
    <ul class="{% cv_button_class "navbar" "nav" %}">
        {% for item in cv_navbar.items %}<li class="{% cv_button_class "navbar" "item" %}"><a class="{% cv_button_class "navbar" "link" %}{% if item.active %} {% cv_button_class "navbar" "link-active" %}{% endif %}" href="{{ item.url }}"{% if item.active %} aria-current="true"{% endif %}>{% if item.icon %}{% cv_icon item.icon %} {% endif %}{{ item.label }}</a></li>{% endfor %}
    </ul>
</nav>{% endif %}
