{% load crud_views_object_detail %}
<div class="row mb-2">
    <div class="col-sm-4 text-body-secondary fw-medium">{{ prop.label }}</div>
    <div class="col-sm-8">
        {% if prop.link_url %}<a href="{{ prop.link_url }}">{% endif %}{% render_property_value prop %}{% if prop.link_url %}</a>{% endif %}
        {% if prop.detail %}<button type="button" class="{% cv_button_class 'object-detail' 'property-detail' %}" data-cv-tooltip data-bs-title="{{ prop.detail }}" aria-label="{{ prop.detail }}">{% cv_icon "property-detail" %}</button>{% endif %}
    </div>
</div>
