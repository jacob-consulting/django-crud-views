{% load crud_views crud_views_object_detail %}
<div class="tab-pane fade{% if presentation.selected %} active show{% endif %}"
     id="{{ presentation.panel_id }}"
     role="tabpanel" tabindex="0"
     {% if component %}aria-labelledby="{{ presentation.control_id }}"{% else %}aria-label="{{ group.title }}"{% endif %}>
    {% cv_heading level=5 class="mb-1" %}{{ group.title }}{% endcv_heading %}
    {% if group.description %}<p class="text-body-secondary small mb-3">{{ group.description }}</p>{% endif %}
    <dl class="row mb-0">
        {% for prop in group.properties %}
        {% render_property prop layout=layout %}
        {% endfor %}
    </dl>
</div>
